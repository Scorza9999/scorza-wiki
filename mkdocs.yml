site_name: "Scorza's Wiki"
site_description: "Personal wiki and study notes I wrote and made public"
site_author: "scorza"

theme:
  name: material
  features:
    - navigation.instant
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo
      accent: indigo

plugins:
  - search
  - roamlinks # Converts Zettlr [[wikilinks]] into clickable MkDocs links

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.betterem

nav:
  - Home: README.md
