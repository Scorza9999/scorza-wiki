site_name: "Scorza's Wiki"
site_description: "Personal wiki and study notes I wrote and made public"
site_author: "scorza"

theme:
  name: material
  features:
    - navigation.instant
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    # 1. Dark Mode (Default)
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to light mode
        
    # 2. Light Mode (Toggle Option)
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode

plugins:
  - search
  - roamlinks # Converts [[wikilinks]] into clickable MkDocs links
  - minify: 
      minify-html: true
      htmlmin_opts:
        remove_comments: true

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - admonition
  - pymdownx.details
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.betterem

nav:
  - Home: index.md
